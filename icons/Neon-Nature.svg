<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a3d0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#021a02;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" fill="#010801" />
  
  <!-- Stylized Organic Leaf Shape -->
  <path d="M50 15 C75 15 85 45 50 85 C15 45 25 15 50 15Z" fill="url(#leaf-grad)" stroke="#0f5a0f" stroke-width="0.5" />
  
  <!-- Cyber Veins (Neon Highlights) -->
  <g filter="url(#neon-glow)">
    <!-- Main Stem -->
    <path d="M50 85 L50 25" stroke="#00ffcc" stroke-width="1.5" fill="none" stroke-linecap="round" />
    
    <!-- Lateral Veins -->
    <path d="M50 70 L75 45" stroke="#00ffcc" stroke-width="1.2" fill="none" stroke-linecap="round" />
    <path d="M50 55 L25 35" stroke="#bcff00" stroke-width="1.2" fill="none" stroke-linecap="round" />
    <path d="M50 40 L70 20" stroke="#bcff00" stroke-width="1" fill="none" stroke-linecap="round" />
    <path d="M50 25 L35 15" stroke="#00ffcc" stroke-width="0.8" fill="none" stroke-linecap="round" />
  </g>
  
  <!-- Floating Spores/Data Points -->
  <circle cx="20" cy="25" r="1.5" fill="#bcff00" filter="url(#neon-glow)" />
  <circle cx="85" cy="60" r="1.2" fill="#00ffcc" filter="url(#neon-glow)" />
  <circle cx="30" cy="80" r="1" fill="#ff00ff" filter="url(#neon-glow)" />
  <circle cx="75" cy="20" r="0.8" fill="#00ffcc" filter="url(#neon-glow)" />
</svg>