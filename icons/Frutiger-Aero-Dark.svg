<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a1f2b" />
      <stop offset="100%" stop-color="#010405" />
    </radialGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2ff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f2ff" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="orbGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#00d4ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5" />
    </radialGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" />
  
  <!-- Vibrant Wave -->
  <path d="M-50 400 Q 150 150 562 350 L 562 512 L -50 512 Z" fill="url(#waveGrad)" filter="url(#glow)" />
  
  <!-- Main Glass Sphere -->
  <circle cx="256" cy="240" r="140" fill="#001a1a" stroke="#00f2ff" stroke-width="1" />
  <circle cx="256" cy="240" r="140" fill="url(#orbGrad)" />
  
  <!-- Glass Reflection (Top) -->
  <path d="M156 180 Q 256 100 356 180 Q 256 140 156 180" fill="url(#gloss)" />
  
  <!-- Accent Bubbles -->
  <circle cx="380" cy="140" r="35" fill="#00ff88" fill-opacity="0.2" filter="blur(4px)" />
  <circle cx="380" cy="140" r="35" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="0.5" />
  
  <circle cx="120" cy="320" r="20" fill="#00f2ff" fill-opacity="0.3" filter="blur(2px)" />
  
  <!-- Bottom Glow -->
  <ellipse cx="256" cy="500" rx="300" ry="80" fill="#00ff88" fill-opacity="0.1" filter="blur(30px)" />
</svg>