<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4158D0" />
      <stop offset="46%" stop-color="#C850C0" />
      <stop offset="100%" stop-color="#FFCC70" />
    </linearGradient>
    
    <radialGradient id="glass_shine" cx="30%" cy="20%" r="50%" fx="30%" fy="20%">
      <stop offset="0%" stop-color="white" stop-opacity="0.6" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </radialGradient>
    
    <linearGradient id="border_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.8" />
      <stop offset="50%" stop-color="white" stop-opacity="0.1" />
      <stop offset="100%" stop-color="white" stop-opacity="0.5" />
    </linearGradient>

    <filter id="blur_bg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="25" />
    </filter>

    <filter id="drop_shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="15" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="#1a1a1a" />
  
  <!-- Vibrant Liquid Blobs -->
  <g filter="url(#blur_bg)">
    <circle cx="150" cy="150" r="120" fill="#00DBDE" fill-opacity="0.8" />
    <circle cx="360" cy="360" r="150" fill="#FC00FF" fill-opacity="0.7" />
    <circle cx="400" cy="100" r="100" fill="#FFCC70" fill-opacity="0.6" />
  </g>

  <!-- Main Glass Squircle -->
  <g filter="url(#drop_shadow)">
    <rect x="64" y="64" width="384" height="384" rx="90" fill="white" fill-opacity="0.1" />
    <rect x="64" y="64" width="384" height="384" rx="90" stroke="url(#border_grad)" stroke-width="2" />
  </g>

  <!-- Liquid Bubble Highlights -->
  <ellipse cx="256" cy="140" rx="140" ry="60" fill="url(#glass_shine)" />
  
  <!-- Bottom Reflection -->
  <path d="M120 400C180 420 332 420 392 400" stroke="white" stroke-width="4" stroke-linecap="round" stroke-opacity="0.3" />
  
  <!-- Inner Glow -->
  <rect x="70" y="70" width="372" height="372" rx="85" stroke="white" stroke-width="1" stroke-opacity="0.1" fill="none" />
</svg>