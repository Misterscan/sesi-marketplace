<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00adef" />
      <stop offset="100%" style="stop-color:#0072bc" />
    </linearGradient>
    <linearGradient id="grassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a2d033" />
      <stop offset="100%" style="stop-color:#48a33e" />
    </linearGradient>
    <radialGradient id="glossHighlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background Sky -->
  <rect width="100" height="100" fill="url(#skyGradient)" />
  
  <!-- Green Hill Base -->
  <path d="M0 60 Q 50 45 100 60 V 100 H 0 Z" fill="url(#grassGradient)" />
  
  <!-- Abstract Glass Swoosh -->
  <path d="M-10 80 Q 50 30 110 80" fill="none" stroke="url(#swooshGrad)" stroke-width="8" />
  
  <!-- Main Glossy Sphere -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4" />
  <circle cx="50" cy="50" r="30" fill="url(#glossHighlight)" fill-opacity="0.3" />
  
  <!-- Top Glass Reflection -->
  <ellipse cx="50" cy="32" rx="18" ry="10" fill="#ffffff" fill-opacity="0.6" />
  
  <!-- Floating Bubbles -->
  <circle cx="20" cy="30" r="5" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="0.5" />
  <circle cx="22" cy="28" r="1.5" fill="#ffffff" fill-opacity="0.6" />
  
  <circle cx="80" cy="20" r="8" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="0.5" />
  <circle cx="83" cy="16" r="2.5" fill="#ffffff" fill-opacity="0.5" />
  
  <circle cx="75" cy="75" r="4" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="0.5" />
  <circle cx="76" cy="73" r="1" fill="#ffffff" fill-opacity="0.6" />
</svg>